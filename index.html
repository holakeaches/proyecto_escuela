<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Mercado Agropecuario</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
      --error: #d32f2f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-card h2 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .login-card p {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .error-msg {
      color: var(--error);
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
      text-align: center;
      background-color: #ffebee;
      padding: 8px;
      border-radius: 4px;
    }

    .btn-login {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>🌾 Acceso al Sistema</h2>
    <p>Ingresa tus credenciales para continuar</p>

    <div class="error-msg" id="errorMsg">Usuario o contraseña incorrectos</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Ingresa tu usuario" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">Iniciar Sesión</button>
    </form>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api/login';
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const btnLogin = document.getElementById('btnLogin');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      errorMsg.style.display = 'none';
      btnLogin.textContent = 'Verificando...';
      btnLogin.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          localStorage.setItem('usuarioLogueado', JSON.stringify(data.empleado));
          // Redirige al panel principal del gerente
          //window.location.href = 'gerente.html';
          window.location.href = 'menu.html';
        } else {
          errorMsg.textContent = data.message || 'Usuario o contraseña incorrectos';
          errorMsg.style.display = 'block';
        }
      } catch (error) {
        errorMsg.textContent = 'Error: No se pudo conectar con el servidor (node server.js)';
        errorMsg.style.display = 'block';
      } finally {
        btnLogin.textContent = 'Iniciar Sesión';
        btnLogin.disabled = false;
      }
    });
  </script>

</body>
</html>
